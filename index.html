<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- displays site properly based on user's device -->
    <link rel="stylesheet" href="styles.css">
    <!-- icon -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    >
    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    >

    <title>Frontend Mentor | Social links profile</title>
  </head>
  <body>
    <!-- div is just a wrapper -->
    <div class="flex-container-col flex-container-center mh-100dvh">
      <main>
        <article
          class="card-social flex-container-center flex-container-col padding-med"
        >
          <img
            class="card-social-img"
            src="assets/images/avatar-jessica.jpeg"
            alt="closeup profile picture of Jessica shaped as a circle"
          />
          <h3 class="card-social-title mt-med">Jessica Randall</h3>
          <p class="card-social-location">London, United Kingdom</p>
          <!-- description or info?? -->
          <p class="card-social-description mt-med">
            "Front-end developer and avid reader."
          </p>
          <ul class="card-social-links mt-med">
            <li class="card-social-item">
              <a class="card-social-link">GitHub</a>
            </li>
            <li class="card-social-item">
              <a class="card-social-link">Frontend Mentor</a>
            </li>
            <li class="card-social-item">
              <a class="card-social-link">LinkedIn</a>
            </li>
            <li class="card-social-item">
              <a class="card-social-link">Twitter</a>
            </li>
            <li class="card-social-item">
              <a class="card-social-link">Instagram</a>
            </li>
          </ul>
        </article>
      </main>
    </div>
    <footer class="attribution">
      Challenge by <a
        href="https://www.frontendmentor.io?ref=challenge"
        target="_blank"
      >Frontend Mentor</a>. Coded by <a href="#">Coinnich</a>.
    </footer>
  </body>
</html>
